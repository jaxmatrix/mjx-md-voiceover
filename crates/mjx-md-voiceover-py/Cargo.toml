[package]
name = "mjx-md-voiceover-py"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Python FFI bindings for mjx-md-voiceover."

[lib]
crate-type = ["cdylib"]

[dependencies]
mjx-md-voiceover-core = { path = "../mjx-md-voiceover-core" }
# `extension-module` is opt-in via the crate feature below so `cargo test`
# can link libpython; maturin enables it when building the wheel.
pyo3 = { version = "0.23", features = ["auto-initialize"] }
serde_json.workspace = true

[features]
default = []
extension-module = ["pyo3/extension-module"]
