[workspace]
resolver = "2"
members = [
    "crates/mjx-md-voiceover-core",
    "crates/mjx-md-voiceover-plugins",
    "crates/mjx-md-voiceover-wasm",
    "crates/mjx-md-voiceover-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["MJX Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mjx/mjx-md-voiceover"
keywords = ["markdown", "tts", "voiceover", "speech", "ast"]
categories = ["parsing", "text-processing", "wasm"]

[workspace.dependencies]
# Core dependencies must be strictly WASM compatible and zero-cost where possible
pulldown-cmark = { version = "0.12", default-features = false }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
pyo3 = { version = "0.23", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = true
