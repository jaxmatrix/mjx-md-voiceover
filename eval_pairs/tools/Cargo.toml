# Standalone package (not a workspace member).
[workspace]

[package]
name = "mjx-voiceover-eval-tools"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "run_eval"
path = "src/main.rs"

[dependencies]
mjx-md-voiceover-core = { path = "../../crates/mjx-md-voiceover-core" }
mjx-md-voiceover-plugins = { path = "../../crates/mjx-md-voiceover-plugins" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
